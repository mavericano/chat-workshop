server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Upstreams are referenced through variables so nginx re-resolves them,
    # otherwise a re-created container (new IP) would keep getting 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_service http://auth-service:8081;
    set $chat_service http://chat-service:8082;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        proxy_pass $auth_service;
    }

    location /api/chat {
        proxy_pass $chat_service;
        # answers are streamed as server-sent events
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/mcp/ {
        proxy_pass $chat_service;
        # adding a server connects to it, which may take a while
        proxy_read_timeout 60s;
    }

    # booking APIs are not part of the chat app
    location /api/ {
        default_type application/problem+json;
        return 404 '{"status":404,"title":"Not Found","detail":"Not available in the chat app"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
