spring.application.name=auth-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/auth}
spring.datasource.username=${DB_USERNAME:auth}
spring.datasource.password=${DB_PASSWORD:auth}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

auth.jwt.issuer=${JWT_ISSUER:room-booking-auth}
auth.jwt.ttl=${JWT_TTL:8h}

management.endpoints.web.exposure.include=health,info
