spring.application.name=chat-service
server.port=8082

# --- Gemini (Google GenAI) ---
# Get a key at https://aistudio.google.com/apikey and put it into GEMINI_API_KEY (see .env in the project root).
spring.ai.google.genai.api-key=${GEMINI_API_KEY:PUT_YOUR_GEMINI_API_KEY_HERE}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=0.4
spring.ai.google.genai.chat.max-output-tokens=2048
# Upper bound for one (streamed) Gemini call; the SDK default is no timeout at all
chat.gemini.timeout=90s
# Only the chat model is used; keep the other Google GenAI models off
spring.ai.model.embedding=none
spring.ai.model.image=none

# --- Chat history storage (own PostgreSQL, survives restarts) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/chat}
spring.datasource.username=${DB_USERNAME:chat}
spring.datasource.password=${DB_PASSWORD:chat}
# Spring AI creates its SPRING_AI_CHAT_MEMORY table on startup (idempotent, CREATE TABLE IF NOT EXISTS)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Number of last messages per user kept as conversation context
chat.memory.max-messages=30

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# chat-db already contains Spring AI's chat memory table, so Flyway starts from a baseline below V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- MCP servers configured by users from the chat UI ---
# Clients are created at runtime from the mcp_server table (see McpClientRegistry), not from properties
spring.ai.mcp.client.enabled=false
mcp.max-servers-per-user=10
mcp.max-tools-per-request=64
mcp.connect-timeout=10s
mcp.request-timeout=30s
# Connections unused for this long are closed and re-opened on the next chat request
mcp.idle-timeout=30m
# Hosts allowed even though they are plain http or resolve to private addresses (comma separated),
# e.g. MCP servers running inside the Docker network. Everything else must be public https.
mcp.allowed-hosts=${MCP_ALLOWED_HOSTS:}
# Key for encrypting auth headers of MCP servers at rest (AES-256-GCM); salt must be hex
mcp.secrets.password=${MCP_SECRETS_KEY:dev-only-change-me}
mcp.secrets.salt=${MCP_SECRETS_SALT:5f2c8a91d4e7b036}

# Tokens are issued by auth-service; verified here with its public keys
auth.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
auth.jwt.issuer=${JWT_ISSUER:room-booking-auth}

# Streaming responses can take a while
spring.mvc.async.request-timeout=5m

management.endpoints.web.exposure.include=health,info

# the MCP SDK logs every server's instructions on connect at INFO
logging.level.io.modelcontextprotocol=WARN

# --- Logging: follow a chat turn, every model round and every MCP tool call ---
# INFO: sizes, timings, token usage, tool names and (shortened) tool arguments.
# DEBUG: also the prompt sent to Gemini (system prompt, history, tool results) and tool results. They contain
# personal data, so DEBUG is for local analysis only: CHAT_LOG_LEVEL=DEBUG in .env, then docker compose up -d chat-service.
logging.level.com.leverx.chat=${CHAT_LOG_LEVEL:INFO}
